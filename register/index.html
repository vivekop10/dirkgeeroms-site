<!DOCTYPE html>
<html lang="en-US">
<head>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — dirkgeeroms.be</title>
  <meta name="description" content="Register an account on dirkgeeroms.be to access physics resources, forum discussions, and files.">
  <link rel="stylesheet" href="/style.css">
  <style>
    .svg-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .otp-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .otp-input {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      transition: all 0.2s;
    }
    .otp-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(65, 166, 42, 0.2);
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="site-brand">
        <h1 class="site-title"><a href="/index.html">dirkgeeroms.be</a></h1>
        <span class="site-tagline">Flipping the classroom</span>
      </div>

      <div class="header-actions">
        <button id="searchToggle" class="header-action-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" class="svg-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="themeToggle" class="header-action-btn" aria-label="Toggle theme">
          <svg class="icon-sun svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon svg-icon" viewBox="0 0 24 24" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" class="svg-icon">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <nav class="primary-nav" id="primaryNav">
        <div class="nav-item"><a href="/contact/index.html">contact</a></div>
        <div class="nav-item"><a href="/links/index.html">links</a></div>
        <div class="nav-item"><a href="/simulations/index.html">simulations</a></div>
        <div class="nav-item"><a href="/filebrowser/index.html">filebrowser</a></div>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="content-area">
      <article class="card page-content-card">
        <div class="card-header">
          <h1 class="card-title page-main-title" id="pageMainHeading">Create an Account</h1>
        </div>
        <div class="card-body">
          <span id="breadcrumbs" class="breadcrumbs">You are here: 
            <a href="/index.html">home</a> &raquo; <span class="breadcrumb_last">Register</span>
          </span>
          <div class="subpage-body-content" style="max-width: 460px; margin-top: 1.5rem;">
            
            <div id="regError" style="display:none;padding:12px 16px;margin-bottom:16px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:8px;color:#ef4444;font-size:0.92rem;"></div>
            <div id="regSuccess" style="display:none;padding:12px 16px;margin-bottom:16px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);border-radius:8px;color:#22c55e;font-size:0.92rem;"></div>

            <!-- STEP 1: Registration Form -->
            <div id="step1Registration">
              <form id="signup_form" class="standard-form">
                <div style="margin-bottom: 14px;">
                  <label for="reg-name" style="font-weight: 600; display:block; margin-bottom: 6px;">Full Name / Display Name</label>
                  <input type="text" id="reg-name" required placeholder="e.g. Dirk Geeroms" style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.95rem;">
                </div>

                <div style="margin-bottom: 14px;">
                  <label for="reg-email" style="font-weight: 600; display:block; margin-bottom: 6px;">Email Address</label>
                  <input type="email" id="reg-email" required placeholder="your.name@school.be" style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.95rem;">
                </div>

                <div style="margin-bottom: 8px;">
                  <label for="reg-pass" style="font-weight: 600; display:block; margin-bottom: 6px;">Password</label>
                  <input type="password" id="reg-pass" required minlength="6" placeholder="At least 6 characters" style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.95rem;">
                </div>

                <!-- Password Strength Bar -->
                <div style="height:4px;border-radius:2px;background:var(--border);margin-bottom: 14px;overflow:hidden;">
                  <div id="passStrengthBar" style="height:100%;width:0;transition:all 0.3s;border-radius:2px;"></div>
                </div>

                <div style="margin-bottom: 20px;">
                  <label for="reg-pass-confirm" style="font-weight: 600; display:block; margin-bottom: 6px;">Confirm Password</label>
                  <input type="password" id="reg-pass-confirm" required minlength="6" placeholder="Repeat password" style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.95rem;">
                </div>

                <button type="submit" class="btn-login" id="regBtn" style="width:100%;padding:12px;font-size:1rem;font-weight:600;cursor:pointer;">
                  Continue to Email Verification
                </button>
              </form>

              <div style="display:flex;align-items:center;gap:12px;margin:22px 0;">
                <hr style="flex:1;border:none;border-top:1px solid var(--border);">
                <span style="color:var(--text-muted);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.5px;">or</span>
                <hr style="flex:1;border:none;border-top:1px solid var(--border);">
              </div>

              <button id="googleSignUpBtn" type="button" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:0.95rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.2s;">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
              </button>

              <div style="margin-top:20px;text-align:center;font-size:0.92rem;color:var(--text-muted);">
                Already have an account? <a href="/login/index.html" style="color:var(--primary);font-weight:600;">Log In</a>
              </div>
            </div>

            <!-- STEP 2: Email OTP Verification View -->
            <div id="step2OtpVerification" style="display:none; text-align:center;">
              <div style="width:60px; height:60px; border-radius:50%; background:rgba(65,166,42,0.15); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                <svg viewBox="0 0 24 24" class="svg-icon" style="width:30px; height:30px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>

              <h3>Verify Your Email Address</h3>
              <p style="color:var(--text-muted); font-size:0.92rem; margin:0.5rem 0 1rem;">
                We sent a 6-digit verification code to <b id="otpEmailTarget">your email</b>.
              </p>

              <!-- OTP Inputs -->
              <div class="otp-inputs">
                <input type="text" maxlength="1" class="otp-input" data-index="0" autofocus>
                <input type="text" maxlength="1" class="otp-input" data-index="1">
                <input type="text" maxlength="1" class="otp-input" data-index="2">
                <input type="text" maxlength="1" class="otp-input" data-index="3">
                <input type="text" maxlength="1" class="otp-input" data-index="4">
                <input type="text" maxlength="1" class="otp-input" data-index="5">
              </div>

              <button type="button" id="verifyOtpBtn" class="btn-login" style="width:100%; padding:12px; font-weight:600; font-size:1rem; margin-top:0.5rem;">
                Verify & Finish Registration
              </button>

              <div style="margin-top:1.25rem; font-size:0.88rem; color:var(--text-muted);">
                Didn't receive code? <button id="resendOtpBtn" style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;">Resend Code</button>
              </div>
            </div>

          </div>
        </div>
      </article>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-copy">
        &#169; Copyleft 2026 <a href="/index.html">dirkgeeroms.be</a>
      </div>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/script.js"></script>
  <script>
    const regForm = document.getElementById('signup_form');
    const regError = document.getElementById('regError');
    const regSuccess = document.getElementById('regSuccess');
    const passBar = document.getElementById('passStrengthBar');
    const step1 = document.getElementById('step1Registration');
    const step2 = document.getElementById('step2OtpVerification');
    const otpInputs = document.querySelectorAll('.otp-input');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');

    let pendingUserData = null;

    function showErr(msg) { regError.textContent = msg; regError.style.display = 'block'; regSuccess.style.display = 'none'; }
    function showOk(msg) { regSuccess.textContent = msg; regSuccess.style.display = 'block'; regError.style.display = 'none'; }

    // Password strength calculation
    document.getElementById('reg-pass').addEventListener('input', (e) => {
      const v = e.target.value;
      let s = 0;
      if (v.length >= 6) s++;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v)) s++;
      if (/[0-9]/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      const pct = (s / 5) * 100;
      const colors = ['#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e'];
      passBar.style.width = pct + '%';
      passBar.style.background = colors[Math.min(s, 4)];
    });

    // Step 1: Submit Details & Request OTP
    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const passConfirm = document.getElementById('reg-pass-confirm').value;
      const btn = document.getElementById('regBtn');

      if (pass !== passConfirm) { showErr('Passwords do not match.'); return; }
      if (pass.length < 6) { showErr('Password must be at least 6 characters.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending verification code...';
      
      pendingUserData = { name, email, pass };

      try {
        const otpInfo = await sendEmailOTP(email);
        document.getElementById('otpEmailTarget').textContent = email;
        step1.style.display = 'none';
        step2.style.display = 'block';
        document.getElementById('pageMainHeading').textContent = 'Email Verification';
        showOk(`Verification code generated! (Code: ${otpInfo.code})`);
        otpInputs[0].focus();
      } catch (err) {
        showErr('Could not send verification code: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Continue to Email Verification';
      }
    });

    // OTP Input Navigation auto-focus next
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    // Step 2: Verify OTP & Create Account in Firebase
    verifyOtpBtn.addEventListener('click', async () => {
      const code = Array.from(otpInputs).map(i => i.value).join('');
      if (code.length < 6) {
        showErr('Please enter the full 6-digit verification code.');
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Verifying & Creating Account...';

      try {
        await verifyEmailOTP(pendingUserData.email, code);
        await firebaseSignUp(pendingUserData.email, pendingUserData.pass, pendingUserData.name);
        showOk('🎉 Account verified and created successfully! Redirecting...');
        setTimeout(() => window.location.href = '/index.html', 1500);
      } catch (err) {
        showErr(err.message);
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = 'Verify & Finish Registration';
      }
    });

    resendOtpBtn.addEventListener('click', async () => {
      if (!pendingUserData) return;
      try {
        const otpInfo = await sendEmailOTP(pendingUserData.email);
        showOk(`New verification code generated! (Code: ${otpInfo.code})`);
      } catch (e) {
        showErr('Could not resend: ' + e.message);
      }
    });

    // Google Sign-Up Handler with Domain Warning guidance
    document.getElementById('googleSignUpBtn').addEventListener('click', async () => {
      try {
        await firebaseSignInWithGoogle();
        showOk('Signed in with Google! Redirecting...');
        setTimeout(() => window.location.href = '/index.html', 1200);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          showErr(err.message);
        }
      }
    });
  </script>
</body>
</html>
